name: Release

# Publishes @sutyr/webhook-lab to npm when a version tag is pushed (v0.2.1,
# v0.3.0, ...). Authentication is npm trusted publishing (OIDC): no npm token
# is stored in this repository, and npm attaches a signed provenance
# attestation linking each version to the run that built it.
#
# Two jobs, so the right to publish never meets third-party code: "build" runs
# pnpm and the test suite with read-only permissions and uploads the packed
# tarball; "publish" holds id-token: write, runs only first-party actions, and
# publishes that exact tarball after checking its SHA-256.
#
# Every action is pinned to a full commit SHA (Dependabot keeps them current).
#
# One-time setup, after the first version exists on npm: add this workflow as
# the package's trusted publisher (see RELEASING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter "./packages/**" build

      - name: Test (unit + integration)
        run: pnpm test

      - name: Build the npm package
        run: pnpm build:pkg

      - name: Package smoke test
        run: pnpm smoke:pkg

      - name: Pack
        id: pack
        run: |
          mkdir -p out
          tarball="$(npm pack --silent --ignore-scripts --pack-destination out | tail -n 1)"
          {
            echo "name=$(node -p "require('./package.json').name")"
            echo "version=$(node -p "require('./package.json').version")"
            echo "tarball=${tarball}"
            echo "sha256=$(sha256sum "out/${tarball}" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: out/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment named in the npm trusted publisher settings.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      # Trusted publishing needs Node 22.14+ and npm 11.5.1+. Node 24 ships a
      # new enough npm, so nothing extra is downloaded into this job.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }
          ' "${npm_version}"

      - name: Download the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: pkg

      - name: Verify the tarball is the one that was tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          actual="$(sha256sum "pkg/${TARBALL}" | cut -d ' ' -f 1)"
          if [ "${actual}" != "${EXPECTED}" ]; then
            echo "SHA-256 mismatch for ${TARBALL}: expected ${EXPECTED}, got ${actual}" >&2
            exit 1
          fi

      # A version already on npm (the first one is published by hand) is left
      # alone, so re-running a release is safe.
      - name: Publish
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "pkg/${TARBALL}" --provenance --access public --ignore-scripts
